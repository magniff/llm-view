<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inside SmolLM2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Inside SmolLM2</h1>
  <nav id="modes" aria-label="mode">
    <button data-mode="complete" title="Raw text in, every internal view">Completion</button>
    <button data-mode="chat" title="A chat app, with a lighter look inside">Chat</button>
  </nav>
  <span id="model-info" class="dim"></span>
</header>

<div id="complete-view">
  <section id="controls">
    <textarea id="prompt" rows="2" spellcheck="false" placeholder="Type a prompt… (Ctrl/⌘+Enter to run)"></textarea>
    <div class="row">
      <button id="run" class="primary">Run prompt</button>
      <span class="sep"></span>
      <button id="step" title="Sample one token and feed it through the model (one decode step)">Step +1</button>
      <button id="gen" title="16 decode steps">Generate +16</button>
      <span class="sep"></span>
      <label>temp <input id="temp" type="number" step="0.1" min="0" value="0.7"></label>
      <label>top-p <input id="topp" type="number" step="0.05" min="0" max="1" value="0.9"></label>
      <label>top-k <input id="topk" type="number" step="1" min="0" value="0"></label>
      <label title="Logits of tokens seen in the last 64 positions are pushed down by this factor">repeat <input id="rep" type="number" step="0.05" min="1" value="1.1"></label>
    </div>
  </section>

  <section id="tokens" aria-label="tokens"></section>
  <div id="status"></div>

  <nav id="tabs"></nav>
  <main id="panel"></main>
</div>

<div id="chat-view" hidden>
  <div class="chat-layout">
    <section class="chat-main">
      <div id="messages" aria-live="polite"></div>
      <form id="composer">
        <textarea id="chat-input" rows="2" placeholder="Message SmolLM2… (Enter to send, Shift+Enter for a new line)"></textarea>
        <div class="composer-buttons">
          <button id="send" class="primary" type="submit">Send</button>
          <button id="stop" type="button" hidden>Stop</button>
        </div>
      </form>
    </section>
    <aside class="chat-side" id="chat-side"></aside>
  </div>
</div>

<div id="loading">
  <div class="loadbox">
    <h2>Loading the model into your browser</h2>
    <p class="dim">Everything runs locally in this tab: a Rust inference engine compiled to WebAssembly.
      The weights come straight from Hugging Face the first time and are cached for later visits.</p>
    <div id="load-stage">starting…</div>
    <div class="loadbar"><i id="load-bar"></i></div>
    <div id="load-detail" class="dim mono"></div>
  </div>
</div>
<div id="tip" role="tooltip"></div>
<div id="flash"></div>
<script src="app.js"></script>
</body>
</html>
